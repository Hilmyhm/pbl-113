<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin gorental</title>
  </head>
  <body>
    <!-- navabar start -->

    <nav>
      <div>
        <div>
          <img src="../img_admin/dashboard/gambar.svg" alt="foto-admin" />
        </div>
        <div>
          <h4>hallo,</h4>
          <h2>Nama Admin</h2>
        </div>
      </div>

      <!-- menu -->
      <ul>
        <!-- nav-beranda -->
        <li>
          <a href="#" title="beranda">
            <img src="../img_admin/dashboard/home.svg" alt="" /><span
              >Beranda</span
            >
          </a>
        </li>

        <!-- nav-data-mobil -->
        <li>
          <a href="#" title="data mobil">
            <img src="../img_admin/dashboard/icon-data-mobil.svg" alt="" /><span
              >Data Mobil</span
            >
          </a>
        </li>

        <!-- nav-transaksi -->
        <li>
          <a href="" class="nav-link" title="transaksi">
            <img src="../img_admin/dashboard/icon-pesanan.svg" alt="" /><span
              >Transaksi</span
            >
          </a>
        </li>

        <!-- nav-riwayat -->
        <li>
          <a href="" class="nav-link" title="riwayat">
            <img src="../img_admin/dashboard/icon-riwayat.svg" alt="" /><span
              >Riwayat</span
            >
          </a>
        </li>
      </ul>

      <div>
        <a href="">
          <img src="../img_admin/dashboard/log-out.svg" alt="" /><span
            >Log Out</span
          >
        </a>
      </div>
    </nav>

    <!-- navabar end -->

    <!-- content start -->
    <section>
      <header>
        <!-- keterangan halaman kiri start -->
        <div>
          <div>
            <div></div>
            <span>INFORMASI RENTAL</span>
          </div>
          <h1>Beranda</h1>
          <p>satu ringkasan transaksi dan data mobil</p>
        </div>
        <!-- keterangan halaman kiri end -->

        <!-- keterangan halaman kanan start -->
        <div>
          <div>
            <div></div>
            <span>OPERASIONAL ARMADA</span>
          </div>
        </div>
      </header>
      <!-- keterangan halaman kanan end -->

      <!-- content-data-mobil start -->
      <main>
        <!-- header content main (DAFTAR KENDARAAN) start -->
        <section>
            <div>
                <h2>Daftar kendaraan</h2>
                <p>24 unit terdaftar ·</p>
            </div>
            <button>
                <img src="../img_admin/data-mobil/plus.svg" alt=""><span>Tambah Mobil</span>
            </button>
        </section>
        <!-- header content main (DAFTAR KENDARAAN) end -->

        <!-- search and filter start -->
        <section>
          <form action="/cari" method="GET">
            <input
              type="search"
              name="keyword"
              placeholder="Cari nama, merk, atau plat nomor"
            />

            <!-- merk -->
            <select id="merk" name="merk">
              <option value="" disabled selected>Merk</option>
              <option value="avanza">Toyota Avanza</option>
              <option value="xenia">Daihatsu Xenia</option>
              <option value="brio">Honda Brio</option>
              <option value="brv">Honda BR-V</option>
            </select>
            
            <!-- jenis -->
            <select id="jeni" name="jenis">
              <option value="" disabled selected>Jenis</option>
              <option value="MPV">MPV</option>
              <option value="SUV">SUV</option>
            </select>
            
            <!-- status -->
            <select id="status" name="status">
              <option value="" disabled selected>Status</option>
              <option value="MPV">Tersedia</option>
              <option value="SUV">Disewa</option>
            </select>

          </form>

          <!-- keterangan table -->
          <p>Menampilkan 1–5 dari 24 kendaraan</p>

        </section>
        <!-- search and filter end -->

        <!-- table start -->
        <table>
            <thead>
                <tr>
                    <th></th>
                </tr>
            </thead>
        </table>
        <!-- table end -->

        <!-- button kembali dan halaman -->
        

      </main>
    </section>
  </body>
</html>
