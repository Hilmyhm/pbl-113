<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar px-4" style="background-color: white;">
        <div class="rounded-4 p-2 d-flex align-items-center justify-content-center gap-4"
            style="background-color: white;">
            <a href="landing-page.html" aria-label="Kembali ke halaman awal"
                class="text-decoration-none fw-bold fs-3 align-items-center"
                style="color: #0b1d33; line-height: 1;">‹</a>
            <h2 class="fw-bold m-0 fs-4" style="line-height: 1;">
                <span style="color: #0b1d33;">Login</span>
            </h2>
        </div>
    </nav>

    <main style="color:#0b1d33">
        <div class="d-flex flex-column align-items-center gap-2">
            <div class="rounded-4 p-2 d-flex align-items-center justify-content-center"
                style="width: 56px; height: 56px; background-color: #ff6b35;">
                <img src="../css/car-front.svg" alt="Logo Gorental" width="30" height="24"
                    class="d-inline-block align-text-top">
            </div>
            <h2 class="fw-bold m-0 fs-4 text-center">
                <span style="color:#ff6b35">Go</span><span style="color:#0b1d33">Rental</span>
            </h2>


            <header>
                <h1 class="display-6 display-md-3 fw-bold mb-3">Masuk ke Akun Anda</h1>
                <p class="text-secondary fs-6 mb-4" style="line-height: 1.6;">Selamat datang kembali! Silakan masuk
                    untuk melanjutkan.</p>
            </header>


            <section style="max-width: 500px; width: 100%; margin: 0 auto;">
                <form>
                    <div class="mb-4">
                        <label for="login" class="form-label">Email / Nomor HP</label>
                        <input type="text" class="form-control" style="border-color: #0b1d33;" id="login"
                            placeholder="contoh@email.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" style="border-color: #0b1d33;" id="password"
                            name="password" placeholder="********" minlength="8" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn text-white fw-bold py-2" type="submit"
                            style="background-color: #0b1d33; border-color: #0b1d33;">Login</button>
                    </div>
                </form>
            </section>

            <section>
                <p>Belum punya akun? <a href="daftar-akun.html">Daftar</a></p>
            </section>
        </div>
    </main>
</body>

</html>
