<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style="color:#0b1d33">
    <nav class="navbar px-4" style="background-color: white;">
        <div class="rounded-4 p-2 d-flex align-items-center justify-content-center gap-4"
            style="background-color: white;">
            <a href="landing-page.html" aria-label="Kembali ke halaman awal"
                class="text-decoration-none fw-bold fs-2 align-items-center"
                style="color: #0b1d33; line-height: 1;">‹</a>
            <h2 class="fw-bold m-0 fs-4" style="line-height: 1;">
                <span style="color: #0b1d33;">Daftar Akun</span>
            </h2>
        </div>
    </nav>
    <main style="color:#0b1d33">
        <div class="d-flex flex-column align-items-center gap-2">
            <header>
                <h1 class="display-6 display-md-3 fw-bold mb-3">Daftar Akun</h1>
            </header>

            <section style="max-width: 500px; width: 100%; margin: 0 auto;">
                <form>
                    <div class="mb-4">
                        <label for="nama" class="form-label">Nama Lengkap:</label>
                        <input type="text" class="form-control" style="border-color: #0b1d33;" id="nama" name="nama"
                            placeholder="Nama sesui KTP" required>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" style="border-color: #0b1d33;" id="email" name="email"
                            placeholder="contoh@gmail.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="no" class="form-label">Nomor Handphone:</label>
                        <input type="tel" class="form-control" style="border-color: #0b1d33;" id="no" name="no"
                            placeholder="08xxxxxxxxxx" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" style="border-color: #0b1d33;" id="password"
                            name="password" placeholder="Minimal 8 karakter" minlength="8" required>
                    </div>

                    <div class="mb-4">
                        <label for="konfirmasi-password" class="form-label">Konfirmasi Password</label>
                        <input type="password" class="form-control" style="border-color: #0b1d33;"
                            id="konfirmasi-password" name="konfirmasi-password" placeholder="Ulangi password"
                            minlength="8" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn text-white fw-bold py-2" type="submit"
                            style="background-color: #0b1d33; border-color: #0b1d33;">Daftar</button>
                    </div>
                </form>
            </section>

            <section>
                <p>Sudah punya akun? <a href="login.html">Login</a></p>
            </section>
        </div>
    </main>
</body>

</html>
