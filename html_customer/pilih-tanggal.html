<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih tanggal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="m-0 p-0 min-vh-100" style="color: #0b1d33; background-color: #eef7fc;">
    <nav class="navbar bg-white py-3 border-bottom">
        <div class="container-fluid position-relative d-flex justify-content-center align-items-center px-3">
            <a href="detail-mobil.html" aria-label="Kembali ke Data Diri" class="position-absolute start-0 ms-3 d-flex align-items-center justify-content-center rounded-circle bg-light text-decoration-none text-dark fw-bold fs-3 pb-1" style="width: 40px; height: 40px; color: #0b1d33;">‹</a>
            <h2 class="fs-3 fw-bold m-0" style="color: #0b1d33;">Pilih Tanggal</h2>
        </div>
    </nav>


    <main class="d-flex flex-column gap-3">


        <section class="card rounded-4 border p-3 px-3 mt-3 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <img src="../img/foto-mobil-kecil.png" alt="Toyota Avanza" class="rounded-3 img-fluid" style="width: 100px; height: 70px; object-fit: cover;" />
                <div>
                    <h6 class="fw-bold mb-1 text-dark">Toyota Avanza</h6>
                    <p class="text-muted small mb-1">MPV Keluarga &bull; Otomatis &bull; 7 Kursi</p>
                    <span class="fw-bold text-dark small">Rp 450.000 <span class="text-muted fw-normal">/ hari</span></span>
                </div>
            </div>
        </section>


        <section class="row g-2 px-3" aria-label="Tanggal sewa">
            <div class="col-6">
                <label for="tanggal-mulai" class="form-label small text-muted fw-semibold">Tanggal Mulai</label>
                <input type="date" id="tanggal-mulai" name="tanggal-mulai" class="form-control rounded-3 py-2 text-dark bg-white" value="2026-10-12" required />
            </div>
            <div class="col-6">
                <label for="tanggal-selesai" class="form-label small text-muted fw-semibold">Tanggal Selesai</label>
                <input type="date" id="tanggal-selesai" name="tanggal-selesai" class="form-control rounded-3 py-2 text-dark bg-white" value="2026-10-14" required />
            </div>
        </section>


        <section class="card rounded-4 border px-3 p-3 shadow-sm" aria-label="Ringkasan sewa">
            <div class="d-flex justify-content-between mb-2 px-3">
                <span class="text-muted small">Durasi sewa</span>
                <strong class="fw-semibold text-dark small">3 hari</strong>
            </div>
            <div class="d-flex justify-content-between align-items-center px-3">
                <span class="text-muted small">Estimasi biaya</span>
                <strong class="fw-bold text-dark">Rp 1.350.000</strong>
            </div>
        </section>

        <form action="ketersediaan-mobil.html" method="get">
            <div class="fixed-bottom bg-white py-3 px-3 border-top shadow-sm">
                <div class="container p-0">
                    <button type="submit" class="btn text-white w-100 py-3 rounded-1 fw-bold d-flex align-items-center justify-content-center gap-2" style="background-color: #0b1d33;"> Cek Ketersediaan
                        <img src="../img/pilih tanggal/panah-kanan-bold.svg" alt="lanjut" width="18" height="18" />
                    </button>
                </div>
            </div>
        </form>

    </main>


</body>

</html>
